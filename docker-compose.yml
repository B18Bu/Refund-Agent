# 客诉舆情退赔决策系统 MVP —— Docker Compose 一键部署
# 架构：FastAPI(生产者) + Redis Streams + Worker(消费者 + LangGraph Checkpointer)
#        + PostgreSQL + React 前端(nginx) + 本地 PaddleOCR 推理
services:
  postgres:
    image: postgres:15-alpine
    # max_connections 提到 200：多 uvicorn worker × SQLAlchemy 连接池累加，默认 100 会在压测时被吃满
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refund
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis：Streams 队列 / 幂等键 / 审批锁（Checkpointer 走 PostgreSQL，见 CHECKPOINTER_BACKEND）
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/refund
      REDIS_URL: redis://redis:6379/0
      CHECKPOINTER_BACKEND: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-secret-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      PROMPT_VERSION: ${PROMPT_VERSION:-refund-v1}
      GOLDEN_REPORT_PATH: /app/artifacts/golden-report.json
      UPLOAD_DIR: /data/uploads
      OCR_DEVICE: cpu
      OCR_LANG: ch
      OCR_MODEL_DIR: /models/paddleocr
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-disabled}
      CUBESANDBOX_API_URL: ${CUBESANDBOX_API_URL:-http://127.0.0.1:3000}
      CUBESANDBOX_API_KEY: ${CUBESANDBOX_API_KEY:-}
      CUBESANDBOX_TEMPLATE_ID: ${CUBESANDBOX_TEMPLATE_ID:-}
      CUBESANDBOX_PROXY_NODE_IP: ${CUBESANDBOX_PROXY_NODE_IP:-}
      CUBESANDBOX_PROXY_PORT: ${CUBESANDBOX_PROXY_PORT:-8080}
    volumes:
      - uploads_data:/data/uploads
      - ./artifacts:/app/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m app.worker.consumer
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/refund
      REDIS_URL: redis://redis:6379/0
      CHECKPOINTER_BACKEND: postgres
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      PROMPT_VERSION: ${PROMPT_VERSION:-refund-v1}
      UPLOAD_DIR: /data/uploads
      OCR_DEVICE: cpu
      OCR_LANG: ch
      OCR_MODEL_DIR: /models/paddleocr
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-disabled}
      CUBESANDBOX_API_URL: ${CUBESANDBOX_API_URL:-http://127.0.0.1:3000}
      CUBESANDBOX_API_KEY: ${CUBESANDBOX_API_KEY:-}
      CUBESANDBOX_TEMPLATE_ID: ${CUBESANDBOX_TEMPLATE_ID:-}
      CUBESANDBOX_PROXY_NODE_IP: ${CUBESANDBOX_PROXY_NODE_IP:-}
      CUBESANDBOX_PROXY_PORT: ${CUBESANDBOX_PROXY_PORT:-8080}
    volumes:
      - uploads_data:/data/uploads
      - type: bind
        source: ${OCR_MODEL_HOST_DIR:-D:/作业/model/PaddleOCR}
        target: /models/paddleocr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
