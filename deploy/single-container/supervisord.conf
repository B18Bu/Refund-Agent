[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:postgres]
command=postgres -D /var/lib/postgresql/data -c max_connections=200
user=postgres
autorestart=unexpected
priority=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:redis]
command=/opt/redis-stack/bin/redis-stack-server --appendonly yes --dir /var/lib/redis
user=redis
autorestart=unexpected
priority=20
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:rag-embedding]
command=/opt/venv/bin/uvicorn rag_embedding_service:app --host 127.0.0.1 --port 8080
directory=/app
autorestart=unexpected
priority=30
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:api]
command=/opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 4
directory=/app
autorestart=unexpected
priority=40
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:worker]
command=/opt/venv/bin/python -m app.worker.consumer
directory=/app
autorestart=unexpected
priority=50
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:catalog-worker]
command=/opt/venv/bin/python -m app.worker.catalog_consumer
directory=/app
autorestart=unexpected
priority=60
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=unexpected
priority=70
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
