services:
  app:
    build:
      context: ../..
      dockerfile: deploy/single-container/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/refund
      REDIS_URL: redis://127.0.0.1:6379/0?socket_timeout=10
      CHECKPOINTER_BACKEND: ${CHECKPOINTER_BACKEND:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-secret-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      PROMPT_VERSION: ${PROMPT_VERSION:-refund-v1}
      GOLDEN_REPORT_PATH: /app/artifacts/golden-report.json
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      TELEMETRY_PROVIDER: ${TELEMETRY_PROVIDER:-noop}
      UPLOAD_DIR: /data/uploads
      OCR_DEVICE: cpu
      OCR_LANG: ch
      OCR_MODEL_DIR: /models/paddleocr
      RAG_EMBEDDING_MODEL_DIR: /models/bge-small-zh-v1.5
      RAG_EMBEDDING_DIMENSION: 512
      SCRAPE_SCHEDULE: ${SCRAPE_SCHEDULE:-0 3 * * *}
      SCRAPE_ALLOWED_SOURCES: ${SCRAPE_ALLOWED_SOURCES:-vivo,xiaomi,generic}
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-1}
      CATALOG_REFRESH_SECONDS: ${CATALOG_REFRESH_SECONDS:-86400}
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-disabled}
    ports:
      - "80:80"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - redis_data:/var/lib/redis
      - uploads_data:/data/uploads
      - ../../artifacts:/app/artifacts
      - ../../evals:/app/evals:ro
      - type: bind
        source: ${OCR_MODEL_HOST_DIR:-D:/作业/model/PaddleOCR}
        target: /models/paddleocr
        read_only: true
      - type: bind
        source: ${RAG_EMBEDDING_MODEL_HOST_DIR:-D:/作业/model/bge-small-zh-v1.5}
        target: /models/bge-small-zh-v1.5
        read_only: true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
